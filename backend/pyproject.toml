[project]
name = "market-briefing-backend"
version = "0.1.0"
description = "Backend for Market Briefing Agent — hand-rolled agentic loop, FastAPI, SSE"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "ddgs>=9.14.4",
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "langgraph>=1.2.5",
    "openai>=1.50",
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
    "python-dotenv>=1.0",
    "slowapi>=0.1.9",
    "sse-starlette>=2.1",
    "trafilatura>=2.1.0",
    "uvicorn[standard]>=0.32",
    "yfinance>=1.4.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "pandas-stubs>=3.0.3.260530",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["yfinance.*", "ddgs.*", "trafilatura.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
