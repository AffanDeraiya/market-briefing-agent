<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Market Briefing Agent — UI direction comparison</title>
<!--
  THROWAWAY design-comparison artifact (not part of the React app, no build step).
  Open by double-clicking. Compares 4 UI directions for the Run view + Home, using
  the REAL AAPL brief the agent produced. Switch variants A/B/C/D (or press 1-4),
  toggle Home/Run, and hit "Replay stream" to feel the live timeline motion.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================ RESET / BASE ============================ */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: #050506; color: #fafafa;
  -webkit-font-smoothing: antialiased;
}
.mono { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }
a { color: inherit; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
:focus-visible { outline: 2px solid #22d3ee; outline-offset: 2px; }

/* ============================ TOP SWITCHER ============================ */
.topbar {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; gap: 18px;
  padding: 10px 18px; background: #0b0b0d; border-bottom: 1px solid #232327;
}
.brandmark { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; white-space: nowrap; }
.brandmark .arrows { font-size: 13px; letter-spacing: -2px; }
.brandmark .up { color: #34d399; } .brandmark .dn { color: #f87171; }
.tabs { display: flex; gap: 6px; flex: 1; flex-wrap: wrap; }
.tab {
  padding: 6px 11px; border-radius: 7px; font-size: 12.5px; font-weight: 500;
  color: #a1a1aa; border: 1px solid transparent; transition: .15s;
}
.tab small { display: block; font-size: 10.5px; opacity: .7; font-weight: 400; }
.tab:hover { color: #fafafa; background: #18181b; }
.tab.active { color: #fafafa; background: #18181b; border-color: #3f3f46; }
.controls { display: flex; align-items: center; gap: 8px; }
.seg { display: inline-flex; background: #18181b; border: 1px solid #2a2a2e; border-radius: 7px; overflow: hidden; }
.seg button { padding: 6px 12px; font-size: 12.5px; color: #a1a1aa; }
.seg button.active { background: #27272a; color: #fafafa; }
.replay {
  padding: 7px 13px; border-radius: 7px; font-size: 12.5px; font-weight: 500;
  background: #22d3ee; color: #08272d;
}
.replay:hover { filter: brightness(1.08); }

#stage { min-height: calc(100vh - 53px); }

/* shared helpers */
.up { color: var(--up); } .down { color: var(--down); }
.sign-pos { color: var(--up); } .sign-neg { color: var(--down); }
.chip-row { display: flex; flex-wrap: wrap; gap: 5px; }

/* ============================ CHART (shared SVG frame) ============================ */
.chart-wrap { width: 100%; }
.chart-wrap svg { width: 100%; height: auto; display: block; }
.anom-dot { transform-origin: center; }
.pulsing { animation: pulse 1.2s ease-out 2; }
@keyframes pulse {
  0% { r: 5; opacity: 1; } 50% { r: 11; opacity: .35; } 100% { r: 5; opacity: 1; }
}

/* timeline reveal animation */
.tl-item { opacity: 1; transform: none; transition: opacity .18s ease, transform .18s ease; }
.tl-item.hidden { opacity: 0; transform: translateY(6px); }
@media (prefers-reduced-motion: reduce) {
  .tl-item, .tl-item.hidden { opacity: 1 !important; transform: none !important; transition: none !important; }
  .pulsing { animation: none !important; }
}

/* ============================================================================
   VARIANT A — "Trading-desk calm"  (faithful spec)
   ============================================================================ */
.vA {
  --bg:#09090b; --panel:#18181b; --raised:#27272a; --bd:#3f3f46;
  --tp:#fafafa; --ts:#a1a1aa; --accent:#22d3ee; --up:#34d399; --down:#f87171;
  --anom:#fbbf24; --line:#e4e4e7;
  background: var(--bg); color: var(--tp); min-height: 100%;
}
.vA .run-header {
  position: sticky; top: 53px; z-index: 20;
  display: flex; align-items: center; gap: 14px;
  padding: 12px 22px; background: rgba(9,9,11,.78); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--bd);
}
.vA .back { color: var(--ts); font-size: 13px; }
.vA .tk { font-size: 15px; font-weight: 600; letter-spacing: .03em; }
.vA .co { color: var(--ts); font-size: 13.5px; }
.vA .pd { color: var(--ts); font-size: 12px; border:1px solid var(--bd); padding:2px 8px; border-radius:999px; }
.vA .status { margin-left: auto; display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color: var(--up); font-weight:500; }
.vA .status .led { width:7px; height:7px; border-radius:999px; background: var(--up); }
.vA .grid { display: grid; grid-template-columns: 360px 1fr; max-width: 1440px; margin: 0 auto; }
.vA .rail { border-right: 1px solid var(--bd); padding: 18px 16px 0; position: relative; min-height: 70vh; display:flex; flex-direction:column; }
.vA .rail h3, .vA .sec-h {
  font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--ts); margin-bottom: 12px;
}
.vA .tline { position: relative; padding-left: 18px; flex:1; }
.vA .tline::before { content:''; position:absolute; left:5px; top:4px; bottom:8px; width:1px; background: var(--bd); }
.vA .ti { position: relative; margin-bottom: 12px; }
.vA .ti .dot { position:absolute; left:-16px; top:5px; width:7px; height:7px; border-radius:999px; background: var(--ts); }
.vA .ti.step .snip { font-style: italic; font-size: 13px; color: var(--ts); }
.vA .ti.anom .dot { background: var(--anom); }
.vA .ti.anom .card { border-color: var(--anom); }
.vA .ti.anom .card .lbl { color: var(--anom); }
.vA .card {
  background: var(--panel); border: 1px solid var(--bd); border-left: 2px solid var(--up);
  border-radius: 10px; padding: 9px 11px;
}
.vA .card .nm { font-size: 12.5px; font-weight: 500; }
.vA .card .in { color: var(--ts); font-size: 11.5px; margin-top: 2px; }
.vA .card .meta { display:flex; justify-content: space-between; align-items:center; margin-top:6px; }
.vA .badge-ms { font-size: 10.5px; color: var(--ts); background: var(--raised); padding: 1px 6px; border-radius: 999px; }
.vA .ok { color: var(--up); font-size: 11px; }
.vA .cost { margin-top: auto; padding: 12px 2px 16px; border-top: 1px solid var(--bd); }
.vA .cost .row { display:flex; justify-content: space-between; font-size: 12px; color: var(--ts); margin-bottom: 6px; }
.vA .bar { height: 4px; background: var(--raised); border-radius: 999px; overflow:hidden; }
.vA .bar > i { display:block; height:100%; width:40%; background: var(--accent); }
.vA .main { padding: 18px 22px 40px; min-width: 0; }
.vA .panel { background: var(--panel); border: 1px solid var(--bd); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
.vA .snap { display: grid; grid-template-columns: repeat(6, 1fr); gap: 1px; background: var(--bd); border:1px solid var(--bd); border-radius: 10px; overflow:hidden; margin-bottom:16px; }
.vA .stat { background: var(--panel); padding: 12px 14px; }
.vA .stat .k { font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--ts); }
.vA .stat .v { font-size: 17px; margin-top: 4px; }
.vA .tech { font-size: 14px; line-height: 1.6; color: #e7e7ea; }
.vA .anomcard { border:1px solid var(--anom); border-radius: 10px; padding: 14px; background: rgba(251,191,36,.05); }
.vA .kbadge { font-size: 10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:#1c1606; background: var(--anom); padding: 2px 8px; border-radius:999px; }
.vA .conf { font-size: 10.5px; font-weight:600; text-transform:uppercase; padding:2px 8px; border-radius:999px; }
.vA .conf.high { color:#06281c; background: var(--up); }
.vA .cols { display:grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.vA .bull-h { color: var(--up); } .vA .bear-h { color: var(--down); }
.vA ul.bul { list-style: none; display:flex; flex-direction:column; gap:9px; }
.vA ul.bul li { font-size: 13.5px; line-height: 1.5; display:flex; gap:7px; }
.vA ul.bul li::before { content:'–'; color: var(--ts); }
.vA .cite { font-family:'JetBrains Mono',monospace; font-size: 10.5px; color: var(--accent); background: rgba(34,211,238,.1); border:1px solid rgba(34,211,238,.25); padding: 0 5px; border-radius: 999px; margin-left:4px; cursor: help; }
.vA .citelist { list-style:none; display:flex; flex-direction:column; gap:7px; }
.vA .citelist li { font-size: 12.5px; color: var(--ts); display:flex; gap:8px; }
.vA .citelist .id { color: var(--accent); }
.vA .foot { border-top:1px solid var(--bd); padding: 14px 22px; color: var(--ts); font-size: 12px; display:flex; justify-content: space-between; max-width:1440px; margin:0 auto; }

/* ============================================================================
   VARIANT B — "Terminal-dense"  (Bloomberg)
   ============================================================================ */
.vB {
  --bg:#050505; --panel:#0d0d0d; --raised:#161616; --bd:#1f1f1f;
  --tp:#e8e8e8; --ts:#7e7e84; --accent:#f59e0b; --up:#22c55e; --down:#ef4444; --anom:#f59e0b; --line:#d4d4d8;
  background: var(--bg); color: var(--tp); min-height:100%;
  font-family: 'JetBrains Mono', monospace; font-size: 12.5px;
}
.vB .tape { display:flex; gap:22px; padding:6px 14px; background:#000; border-bottom:1px solid var(--bd); font-size:11.5px; color:var(--ts); overflow:hidden; white-space:nowrap; }
.vB .tape b { color: var(--tp); font-weight:600; }
.vB .run-header { display:flex; align-items:center; gap:16px; padding:8px 14px; border-bottom:1px solid var(--bd); background:#000; text-transform:uppercase; letter-spacing:.06em; font-size:11.5px; }
.vB .run-header .tk { color: var(--accent); font-weight:600; letter-spacing:.1em; }
.vB .run-header .status { margin-left:auto; color: var(--up); }
.vB .grid { display:grid; grid-template-columns: 320px 1fr; }
.vB .rail { border-right:1px solid var(--bd); padding:0; display:flex; flex-direction:column; }
.vB .rail .h { padding:6px 12px; border-bottom:1px solid var(--bd); color:var(--ts); text-transform:uppercase; letter-spacing:.08em; font-size:10.5px; }
.vB .log { padding:8px 12px; flex:1; }
.vB .log .ln { display:flex; gap:8px; padding:3px 0; font-size:11.5px; line-height:1.5; }
.vB .log .ts { color:#55555a; }
.vB .log .g-ok { color: var(--up); }
.vB .log .nm { color: var(--tp); }
.vB .log .in { color: var(--ts); }
.vB .log .ms { color:#55555a; margin-left:auto; }
.vB .log .anom { color: var(--anom); }
.vB .log .step { color:var(--ts); font-style: italic; font-family:'Inter',sans-serif; }
.vB .cost { border-top:1px solid var(--bd); padding:8px 12px; color:var(--ts); font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; }
.vB .cost .bar { height:3px; background:#000; border:1px solid var(--bd); margin-top:5px; }
.vB .cost .bar > i { display:block; height:100%; width:40%; background:var(--accent); }
.vB .main { padding:0; min-width:0; }
.vB .block { border-bottom:1px solid var(--bd); padding:10px 14px; }
.vB .block > .h { color:var(--ts); text-transform:uppercase; letter-spacing:.08em; font-size:10.5px; margin-bottom:8px; }
.vB .dgrid { display:grid; grid-template-columns: repeat(3, 1fr); gap:1px; background:var(--bd); border:1px solid var(--bd); }
.vB .dgrid .c { background:var(--bg); padding:6px 10px; display:flex; justify-content:space-between; align-items:baseline; }
.vB .dgrid .c .k { color:var(--ts); text-transform:uppercase; font-size:10px; letter-spacing:.05em; }
.vB .dgrid .c .v { font-weight:600; }
.vB .tech { font-family:'Inter',sans-serif; font-size:13px; line-height:1.55; color:#cfcfd2; }
.vB .anomrow { display:flex; gap:14px; align-items:baseline; border:1px solid var(--anom); padding:8px 10px; background:rgba(245,158,11,.06); }
.vB .anomrow .mag { color:var(--anom); font-weight:600; }
.vB .anomrow .ex { font-family:'Inter',sans-serif; color:#cfcfd2; font-size:12.5px; line-height:1.5; }
.vB .twocol { display:grid; grid-template-columns:1fr 1fr; gap:0; }
.vB .twocol > div { padding:0 14px; }
.vB .twocol > div:first-child { border-right:1px solid var(--bd); padding-left:0; }
.vB ul.bul { list-style:none; }
.vB ul.bul li { font-family:'Inter',sans-serif; font-size:12.5px; line-height:1.5; padding:5px 0; border-bottom:1px dotted var(--bd); }
.vB .bull-h{color:var(--up);} .vB .bear-h{color:var(--down);}
.vB .cite { color:var(--accent); font-size:10.5px; }
.vB .conf { color:var(--up); text-transform:uppercase; font-size:10px; border:1px solid var(--up); padding:1px 5px; }
.vB .citelist { list-style:none; font-size:11px; }
.vB .citelist li { padding:3px 0; color:var(--ts); }
.vB .citelist .id { color:var(--accent); }
.vB .foot { border-top:1px solid var(--bd); padding:8px 14px; color:var(--ts); font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; display:flex; justify-content:space-between; }

/* ============================================================================
   VARIANT C — "Modern SaaS"  (Linear / Vercel)
   ============================================================================ */
.vC {
  --bg:#0a0a0b; --panel:#0f0f12; --raised:#16161a; --bd:rgba(255,255,255,.07);
  --tp:#f4f4f5; --ts:#9a9aa3; --accent:#818cf8; --up:#34d399; --down:#f87171; --anom:#fbbf24; --line:#c7c7d1;
  background:
    radial-gradient(1200px 500px at 80% -10%, rgba(129,140,248,.10), transparent 60%),
    var(--bg);
  color: var(--tp); min-height:100%;
}
.vC .run-header { position:sticky; top:53px; z-index:20; display:flex; align-items:center; gap:14px; padding:18px 32px; background:rgba(10,10,11,.7); backdrop-filter:blur(10px); border-bottom:1px solid var(--bd); }
.vC .back{ color:var(--ts); font-size:13px;}
.vC .tk{ font-size:16px; font-weight:600; letter-spacing:.02em;}
.vC .co{ color:var(--ts); font-size:14px;}
.vC .pd{ color:var(--ts); font-size:12px; border:1px solid var(--bd); padding:3px 10px; border-radius:999px;}
.vC .status{ margin-left:auto; display:inline-flex; align-items:center; gap:7px; font-size:13px; color:var(--up); font-weight:500;}
.vC .status .led{ width:8px;height:8px;border-radius:999px;background:var(--up); box-shadow:0 0 0 4px rgba(52,211,153,.15);}
.vC .grid{ display:grid; grid-template-columns: 380px 1fr; max-width:1380px; margin:0 auto; gap:8px; padding:8px; }
.vC .rail{ padding:22px; display:flex; flex-direction:column; }
.vC .rail .h, .vC .sec-h{ font-size:12px; font-weight:600; color:var(--ts); margin-bottom:16px; letter-spacing:.01em; }
.vC .stepper{ position:relative; padding-left:26px; flex:1; }
.vC .stepper::before{ content:''; position:absolute; left:9px; top:6px; bottom:10px; width:2px; background:linear-gradient(var(--bd), transparent); }
.vC .si{ position:relative; margin-bottom:16px; }
.vC .si .node{ position:absolute; left:-22px; top:3px; width:18px; height:18px; border-radius:999px; background:var(--panel); border:2px solid var(--bd); display:flex; align-items:center; justify-content:center; font-size:9px; color:var(--up); }
.vC .si.anom .node{ border-color:var(--anom); color:var(--anom); }
.vC .si.step .snip{ font-size:13.5px; color:var(--ts); }
.vC .scard{ background:var(--panel); border:1px solid var(--bd); border-radius:14px; padding:13px 15px; }
.vC .scard .nm{ font-weight:500; font-size:13.5px; }
.vC .scard .in{ color:var(--ts); font-size:12px; margin-top:3px; }
.vC .scard .ms{ float:right; font-size:11px; color:var(--ts); }
.vC .si.anom .scard{ border-color:rgba(251,191,36,.4); background:rgba(251,191,36,.05); }
.vC .si.anom .scard .nm{ color:var(--anom); }
.vC .cost{ margin-top:auto; padding-top:18px; }
.vC .cost .lab{ display:flex; justify-content:space-between; font-size:12.5px; color:var(--ts); margin-bottom:8px; }
.vC .bar{ height:6px; background:var(--raised); border-radius:999px; overflow:hidden; }
.vC .bar > i{ display:block; height:100%; width:40%; background:linear-gradient(90deg,var(--accent),#a5b4fc); }
.vC .main{ padding:22px 32px 48px; min-width:0; }
.vC .card{ background:var(--panel); border:1px solid var(--bd); border-radius:18px; padding:22px; margin-bottom:18px; }
.vC .snap{ display:grid; grid-template-columns:repeat(6,1fr); gap:14px; }
.vC .stat .k{ font-size:11.5px; color:var(--ts); }
.vC .stat .v{ font-size:22px; font-weight:600; margin-top:6px; letter-spacing:-.01em; }
.vC h2.sec-h{ font-size:13px; }
.vC .tech{ font-size:15px; line-height:1.7; color:#dcdce0; }
.vC .anomcard{ border:1px solid rgba(251,191,36,.35); border-radius:16px; padding:20px; background:rgba(251,191,36,.04); }
.vC .kbadge{ font-size:11px; font-weight:600; color:#1c1606; background:var(--anom); padding:3px 10px; border-radius:999px; }
.vC .conf.high{ font-size:11px; font-weight:600; color:#06281c; background:var(--up); padding:3px 10px; border-radius:999px; }
.vC .cols{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }
.vC .bull-h{color:var(--up);} .vC .bear-h{color:var(--down);}
.vC ul.bul{ list-style:none; display:flex; flex-direction:column; gap:12px; }
.vC ul.bul li{ font-size:14px; line-height:1.55; color:#dcdce0; }
.vC .cite{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--accent); background:rgba(129,140,248,.12); padding:1px 7px; border-radius:999px; margin-left:5px; cursor:help; }
.vC .citelist{ list-style:none; display:flex; flex-direction:column; gap:10px; }
.vC .citelist li{ font-size:13px; color:var(--ts); }
.vC .citelist .id{ color:var(--accent); }
.vC .foot{ max-width:1380px; margin:0 auto; padding:18px 32px; color:var(--ts); font-size:12.5px; display:flex; justify-content:space-between; }

/* ============================================================================
   VARIANT D — "Agent research console"  (Perplexity / answer engine)
   ============================================================================ */
.vD {
  --bg:#0b0b0c; --panel:#121214; --raised:#1a1a1d; --bd:#26262b;
  --tp:#ededee; --ts:#8d8d96; --accent:#2dd4bf; --up:#34d399; --down:#f87171; --anom:#fbbf24; --line:#d4d4d8;
  background: var(--bg); color: var(--tp); min-height:100%;
}
.vD .run-header{ display:flex; align-items:center; gap:14px; padding:16px 28px; border-bottom:1px solid var(--bd); }
.vD .tk{ font-size:16px; font-weight:600; }
.vD .co{ color:var(--ts); font-size:14px; }
.vD .pd{ color:var(--ts); font-size:12px; border:1px solid var(--bd); padding:3px 10px; border-radius:999px; }
.vD .status{ margin-left:auto; display:inline-flex; align-items:center; gap:7px; font-size:13px; color:var(--up); }
.vD .status .led{ width:8px;height:8px;border-radius:999px;background:var(--up); }
.vD .grid{ display:grid; grid-template-columns:440px 1fr; max-width:1320px; margin:0 auto; min-height:70vh; }
.vD .agent{ border-right:1px solid var(--bd); padding:22px 22px 0; display:flex; flex-direction:column; background:var(--panel); }
.vD .agent .h{ font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--accent); margin-bottom:16px; display:flex; align-items:center; gap:8px; }
.vD .agent .h .pulse{ width:7px;height:7px;border-radius:999px;background:var(--accent); }
.vD .narr{ flex:1; }
.vD .nblock{ margin-bottom:14px; }
.vD .nblock .say{ font-size:14px; line-height:1.6; color:#d6d6da; }
.vD .toolchip{ display:inline-flex; align-items:center; gap:8px; margin-top:8px; padding:7px 11px; background:var(--raised); border:1px solid var(--bd); border-radius:10px; font-family:'JetBrains Mono',monospace; font-size:11.5px; }
.vD .toolchip .nm{ color:var(--accent); } .vD .toolchip .in{ color:var(--ts); } .vD .toolchip .ms{ color:#5b5b62; }
.vD .toolchip .ok{ color:var(--up); }
.vD .nblock.anom .say{ color:var(--anom); }
.vD .cost{ margin-top:auto; padding:14px 0 16px; border-top:1px solid var(--bd); font-size:12px; color:var(--ts); display:flex; gap:14px; }
.vD .doc{ padding:30px 44px 48px; max-width:760px; }
.vD .doc h1{ font-size:26px; font-weight:700; letter-spacing:-.01em; }
.vD .doc .sub{ color:var(--ts); font-size:14px; margin:4px 0 18px; }
.vD .doc .lede{ font-size:16px; line-height:1.7; color:#dcdce0; }

const pct = n => sign(n) + "%";
const cls = n => n>0?"sign-pos":n<0?"sign-neg":"";
function citeTitle(id){ const c = DATA.citations.find(x=>x.id===id); return c? c.title + (c.url?" — "+c.url:"") : id; }

/* citation refs styled per variant */
function refs(ids, v){
  if(v==='D') return ids.map((id,i)=>`<sup class="cite" title="${citeTitle(id)}">${DATA.citations.findIndex(c=>c.id===id)+1}</sup>`).join('');
  return ' ' + ids.map(id=>`<span class="cite" title="${citeTitle(id)}">[${id}]</span>`).join(' ');
}
function bullets(arr, v){ return `<ul class="bul">`+arr.map(b=>`<li><span>${b.text}${refs(b.cites,v)}</span></li>`).join('')+`</ul>`; }

/* ---- inline SVG chart ---- */
function chartSVG(v){
  const W=620,H=200, padB=34, padT=14, padL=4, padR=10;
  const cs=DATA.chart, n=cs.length;
  const ymin=240,ymax=320;
  const x=i=> padL + i*(W-padL-padR)/(n-1);
  const y=c=> padT + (1-(c-ymin)/(ymax-ymin))*(H-padT-padB);
  const vmax=Math.max(...cs.map(d=>d.v));
  const lineCol="var(--line)", area="color-mix(in srgb, var(--line) 14%, transparent)";
  let line="", areaP="", vols="", labels="";
  cs.forEach((d,i)=>{ const px=x(i),py=y(d.c); line+=(i?` L`:`M`)+px.toFixed(1)+" "+py.toFixed(1);
    const vh=(d.v/vmax)*22; vols+=`<rect x="${(px-5).toFixed(1)}" y="${(H-padB-vh).toFixed(1)}" width="10" height="${vh.toFixed(1)}" fill="var(--bd)" opacity=".7"/>`;
    if(i%3===0||i===n-1) labels+=`<text x="${px.toFixed(1)}" y="${H-12}" fill="var(--ts)" font-size="10" font-family="JetBrains Mono" text-anchor="middle">${d.w}</text>`;
  });
  areaP=`M${x(0)} ${H-padB} L`+cs.map((d,i)=>x(i).toFixed(1)+" "+y(d.c).toFixed(1)).join(" L")+` L${x(n-1)} ${H-padB} Z`;
  const ax=x(n-1), ay=y(290.55);

  return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="AAPL price chart">
    ${grid}${vols}

    <path d="${line}" fill="none" stroke="${lineCol}" stroke-width="2"/>

/* ============================ HOME VIEWS ============================ */

  return `<section class="v${v}"><div class="home">
    <h1>Watch an AI agent research a stock — every step cited.</h1>
    <p>Enter a ticker. The agent pulls prices, detects anomalies, investigates each one with date-scoped news, and writes a cited brief — live.</p>

    <div class="recents"><div class="h">Recent briefs</div>
      <div class="r"><span><span class="mono">AAPL</span> · Apple Inc.</span><span class="mono">3mo · 27s</span></div>
      <div class="r"><span><span class="mono">MSFT</span> · Microsoft</span><span class="mono">3mo · 31s</span></div>

/* ============================ STATE / RENDER ============================ */
let cur="A", view="run";
const RUN={A:runA,B:runB,C:runC,D:runD};
function render(){
  document.getElementById('stage').innerHTML = view==='home'? homeView(cur) : RUN[cur]();
}
document.getElementById('tabs').addEventListener('click', e=>{
  const b=e.target.closest('.tab'); if(!b) return;
  cur=b.dataset.v; document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t===b)); render();
});
document.getElementById('viewSeg').addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b) return;
  view=b.dataset.view; document.querySelectorAll('#viewSeg button').forEach(x=>x.classList.toggle('active', x===b)); render();
});
document.addEventListener('keydown', e=>{
  const map={'1':'A','2':'B','3':'C','4':'D'};
  if(map[e.key]){ cur=map[e.key]; document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.v===cur)); render(); }
});

/* ============================ REPLAY ============================ */
document.getElementById('replayBtn').addEventListener('click', ()=>{
  if(view!=='run') { view='run'; document.querySelectorAll('#viewSeg button').forEach(x=>x.classList.toggle('active', x.dataset.view==='run')); render(); }
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const items=[...document.querySelectorAll('#stage .tl-item')];
  if(reduce || !items.length) return;
  items.forEach(el=>el.classList.add('hidden'));
  items.forEach((el,i)=>{
    setTimeout(()=>{
      el.classList.remove('hidden');
      if(el.classList.contains('anom')||el.querySelector('.anom')||(el.dataset.i==='4')){
        const dot=document.getElementById('anomDot-'+cur);
        if(dot){ dot.classList.remove('pulsing'); void dot.getBBox(); dot.classList.add('pulsing'); }
      }
    }, i*340);
  });
});

render();
</script>
