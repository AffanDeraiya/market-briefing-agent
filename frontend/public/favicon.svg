<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <!-- Market Briefing Agent — chart line with a flagged anomaly (the product's differentiator) -->
  <rect width="48" height="48" rx="11" fill="#1e3a5f"/>
  <!-- baseline -->
  <line x1="9" y1="37" x2="39" y2="37" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.4" stroke-linecap="round"/>
  <!-- price line (warm paper) -->
  <polyline points="9,33 15,29 21,31 27,15 33,24 39,20" fill="none" stroke="#f3f2ee" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- anomaly pin -->
  <line x1="27" y1="12.5" x2="27" y2="7" stroke="#f0a93a" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="1.6 1.8"/>
  <!-- anomaly dot -->
  <circle cx="27" cy="15" r="3.4" fill="#f0a93a" stroke="#1e3a5f" stroke-width="1.8"/>
</svg>
